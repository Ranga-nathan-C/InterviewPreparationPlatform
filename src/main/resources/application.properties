# "In JDBC, we manually create the database connection using DriverManager, 
# create Statement objects, execute SQL, process ResultSet, and close resources ourselves. 
# In Spring Boot, we configure the database in application.properties, and Spring Boot automatically 
# creates and manages a DataSource (typically using HikariCP). With Spring Data JPA, 
# we usually don't write connection or SQL management code because the framework handles it."

# "Why do we use MVC?"
# "MVC separates the application into layers with distinct responsibilities. The Controller handles incoming requests,
#  the Service contains business logic, the Repository manages database operations, and the View (or API response in REST applications)
#   presents the result. This separation improves maintainability, readability, testability, and scalability."


# We prefer constructor injection because it makes dependencies explicit, 
# allows us to declare them as final, ensures the object cannot be created without its required dependencies, 
# avoids hidden dependencies, improves testability, 
# and helps detect configuration problems during application startup instead of causing NullPointerExceptions at runtime.



